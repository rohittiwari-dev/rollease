name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  BUN_VERSION: "latest"

permissions:
  contents: read

jobs:
  # ── Lint & Type Check ─────────────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type check
        run: cd packages/rollease && bunx tsc --noEmit

  # ── Unit Tests (Node matrix) ──────────────────────────────────────────────
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run tests
        run: cd packages/rollease && bunx vitest run --reporter=verbose
      - name: Run tests with coverage
        if: matrix.node == 20
        run: cd packages/rollease && bunx vitest run --coverage
      - name: Upload coverage
        if: matrix.node == 20
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: packages/rollease/coverage/

  # ── Unit Tests (Bun) ──────────────────────────────────────────────────────
  test-bun:
    name: Test (Bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run tests
        run: cd packages/rollease && bun test

  # ── Build & Verify ────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build package
        run: cd packages/rollease && bunx tsup
      - name: Verify dist entry points
        run: |
          cd packages/rollease
          for f in index client handler testing codegen react next vue svelte angular nestjs react-native middleware openfeature telemetry migrations; do
            test -f "dist/${f}.js"   || (echo "Missing: dist/${f}.js" && exit 1)
            test -f "dist/${f}.mjs"  || (echo "Missing: dist/${f}.mjs" && exit 1)
          done
          echo "All entry points present"
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: packages/rollease/dist/

  # ── Coverage Gate ─────────────────────────────────────────────────────────
  coverage-gate:
    name: Coverage Gate (≥80%)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check coverage thresholds
        run: |
          cd packages/rollease
          bunx vitest run --coverage \
            --coverage.thresholds.lines=80 \
            --coverage.thresholds.functions=75

  # ── Package Smoke Test ────────────────────────────────────────────────────
  package-smoke:
    name: Package Smoke Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build
        run: cd packages/rollease && bunx tsup
      - name: npm pack dry-run
        run: cd packages/rollease && npm pack --dry-run
      - name: Verify CJS require
        run: |
          cd packages/rollease
          node -e "require('./dist/index.js');    console.log('index OK')"
          node -e "require('./dist/handler.js');  console.log('handler OK')"
          node -e "require('./dist/testing.js');  console.log('testing OK')"

  # ── Edge Runtime Smoke Test ───────────────────────────────────────────────
  edge-runtime:
    name: Edge Runtime
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build
        run: cd packages/rollease && bunx tsup
      - name: Edge runtime smoke tests
        run: cd packages/rollease && bun test tests/edge-runtime.test.ts

  # ── Bundle Size Budget ────────────────────────────────────────────────────
  size:
    name: Bundle Size
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build
        run: cd packages/rollease && bunx tsup
      - name: Check bundle size (<2MB)
        run: |
          SIZE=$(du -sk packages/rollease/dist/ | cut -f1)
          echo "Dist size: ${SIZE}KB"
          if [ "$SIZE" -gt 2048 ]; then
            echo "Bundle too large: ${SIZE}KB > 2048KB" && exit 1
          fi

  # ── Release (main branch only) ────────────────────────────────────────────
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build, size, package-smoke, edge-runtime]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build
        run: cd packages/rollease && bunx tsup
      - name: Log version
        run: |
          VERSION=$(node -p "require('./packages/rollease/package.json').version")
          echo "Version: ${VERSION}"
      # Uncomment to publish:
      # - name: Publish to npm
      #   run: cd packages/rollease && npm publish --provenance
      #   env:
      #     NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
